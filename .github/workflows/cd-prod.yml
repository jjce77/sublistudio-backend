# CD de producción: NO reconstruye ninguna imagen — promueve la imagen que ya se construyó y
# validó en "qa" (misma imagen, identificada por su SHA), la vuelve a etiquetar como ":latest"
# en ghcr.io (sin bajar ni recompilar capas — solo mueve el manifest), y la despliega en el
# EC2. Cumple el principio "build once, deploy many" de CI-CD-STRATEGY.md: lo que corre en
# producción es exactamente lo que se probó en QA, byte a byte.
#
# Antes de promover, guarda la versión que YA estaba corriendo en producción bajo el tag
# ":to-rollback" — leyendo el IMAGE_TAG real desde el .env del EC2 (no ":latest" del registry,
# que podría estar desincronizado de lo que realmente corre ahí, si algo lo pisó sin pasar por
# este workflow). Así rollback.yml siempre tiene un punto de retorno confiable, sin depender de
# que alguien recuerde o escriba a mano el SHA correcto en medio de un incidente.
#
# Se dispara a mano (workflow_dispatch), no en cada push a main — porque el SHA del commit en
# main casi nunca coincide con el SHA que usó cd-qa.yml para taggear la imagen (un merge
# commit, squash o rebase le cambian el hash, aunque el contenido sea el mismo). Quien aprueba
# el pase a producción pega acá el SHA exacto que se validó en qa.
#
# Requisitos antes de que esto funcione (ver instrucciones aparte):
#   1. Secrets: EC2_HOST, EC2_USERNAME, EC2_SSH_KEY (clave privada), y opcionalmente EC2_PORT.
#   2. En el EC2, una carpeta de despliegue (ej. /opt/sublistudio-backend) con
#      docker-compose.prod.yml y un .env real ya copiados a mano (una sola vez), con PORT
#      definido ahí (se usa para el smoke test contra /health).
#   3. En esa misma carpeta del EC2, haber hecho `docker login ghcr.io` una vez con un token
#      que tenga permiso de lectura sobre el paquete (salvo que el paquete se haga público).
name: CD - producción (EC2)

on:
  workflow_dispatch:
    inputs:
      qa_sha:
        description: 'commit`s SHA for promote image to prod (previously validated)'
        required: true

jobs:
  capture-current-tag:
    runs-on: ubuntu-latest
    outputs:
      current_tag: ${{ steps.read.outputs.tag }}
    steps:
      - name: Cargar clave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # No lee ":latest" del registry — lee el IMAGE_TAG real del .env del EC2, que es la
      # única fuente de verdad de qué está corriendo ahí en este momento. Si el archivo o la
      # variable todavía no existen (primer deploy de la vida del proyecto), queda vacío y el
      # paso de "Guardar como :to-rollback" en el siguiente job se salta sin romper nada.
      - name: Leer IMAGE_TAG real desde el .env del EC2
        id: read
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.EC2_PORT || 22 }} -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          CURRENT=$(ssh -p ${{ secrets.EC2_PORT || 22 }} ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "grep '^IMAGE_TAG=' /opt/sublistudio-backend/.env 2>/dev/null | cut -d= -f2")
          echo "tag=$CURRENT" >> "$GITHUB_OUTPUT"

  promote-image:
    needs: capture-current-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name - lowercase (ghcr.io requires it)
        id: image
        run: echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Guardar la versión actual de producción como ":to-rollback"
        if: needs.capture-current-tag.outputs.current_tag != ''
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.image.outputs.name }}:to-rollback \
            ${{ steps.image.outputs.name }}:${{ needs.capture-current-tag.outputs.current_tag }}

      # imagetools create solo copia el manifest en el registry — no descarga ni reconstruye
      # ninguna capa. La imagen que termina en :latest y en :<qa_sha> es bit a bit la misma que
      # ya está en :qa-<qa_sha>, la que el equipo probó en QA.
      - name: Promote image from qa to production (not build).
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.image.outputs.name }}:latest \
            --tag ${{ steps.image.outputs.name }}:${{ github.event.inputs.qa_sha }} \
            ${{ steps.image.outputs.name }}:qa-${{ github.event.inputs.qa_sha }}

  deploy-ec2:
    needs: promote-image
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            cd /opt/sublistudio-backend
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${{ github.event.inputs.qa_sha }}" >> .env
            set -a
            . ./.env
            set +a
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            sleep 5
            curl -f "http://localhost:${PORT:-3000}/health"
            docker image prune -f
