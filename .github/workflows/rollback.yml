# Rollback de emergencia en EC2: re-apunta ":latest" en ghcr.io a una versión anterior
# (identificada por su SHA, sin reconstruir nada) y la despliega. Además de arreglar lo que
# está corriendo AHORA, corrige ":latest" en el registry — así, si el EC2 se reinicia más
# adelante, no vuelve a traer por accidente la versión con el bug.
#
# Usar cuando el smoke test de cd-prod.yml falla, o cuando se detecta un problema después de un
# deploy (ver sección 6 de CI-CD-STRATEGY.md). El "target_sha" tiene que ser un SHA que ya haya
# sido promovido a producción alguna vez por cd-prod.yml (ahí queda taggeado como
# ghcr.io/<owner>/<repo>:<sha>, sin prefijo "qa-").
#
# Nota: si el bug involucró una migración de base de datos, este workflow NO la revierte —
# Prisma no deshace migraciones automáticamente. Evaluar eso a mano antes o después de correr
# esto (ver la misma sección 6 de la estrategia).
name: Rollback - producción (EC2)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'SHA de la última versión buena conocida ya promovida a producción, a la que volver'
        required: true

jobs:
  repoint-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de imagen en minúsculas (ghcr.io lo exige)
        id: image
        run: echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Re-apuntar ":latest" a la versión buena
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.image.outputs.name }}:latest \
            ${{ steps.image.outputs.name }}:${{ github.event.inputs.target_sha }}

  deploy-ec2:
    needs: repoint-latest
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            cd /opt/sublistudio-backend
            set -a
            . ./.env
            set +a
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            sleep 5
            curl -f "http://localhost:${PORT:-3000}/health"
            docker image prune -f
