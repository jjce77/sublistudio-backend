# Rollback de emergencia en EC2: re-apunta ":latest" en ghcr.io a una versión anterior (sin
# reconstruir nada) y la despliega. Por default (target_sha vacío) usa ":to-rollback" — la
# versión que cd-prod.yml guardó automáticamente antes del último deploy, leída del IMAGE_TAG
# real que estaba en el .env del EC2 (no adivinada del registry). Para volver más de un paso
# atrás (más allá del último deploy), se puede pasar un SHA específico en target_sha.
#
# Usar cuando el smoke test de cd-prod.yml falla, o cuando se detecta un problema después de un
# deploy (ver sección 6 de CI-CD-STRATEGY.md).
#
# Nota: si el bug involucró una migración de base de datos, este workflow NO la revierte —
# Prisma no deshace migraciones automáticamente. Evaluar eso a mano antes o después de correr
# esto (ver la misma sección 6 de la estrategia).
name: Rollback - producción (EC2)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'SHA específico al que volver (dejar vacío para usar ":to-rollback" automáticamente — la versión previa al último deploy)'
        required: false

jobs:
  repoint-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      resolved_tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de imagen en minúsculas (ghcr.io lo exige)
        id: image
        run: echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolver a qué tag volver
        id: resolve
        run: |
          TAG="${{ github.event.inputs.target_sha }}"
          if [ -z "$TAG" ]; then
            TAG="to-rollback"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Re-apuntar ":latest" a la versión buena
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.image.outputs.name }}:latest \
            ${{ steps.image.outputs.name }}:${{ steps.resolve.outputs.tag }}

  deploy-ec2:
    needs: repoint-latest
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            cd /opt/sublistudio-backend
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${{ needs.repoint-latest.outputs.resolved_tag }}" >> .env
            set -a
            . ./.env
            set +a
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            sleep 5
            curl -f "http://localhost:${PORT:-3000}/health"
            docker image prune -f
