# Completar con los valores reales de tu proyecto en sonarcloud.io (Administration > General
# Settings, o la URL del proyecto: sonarcloud.io/project/overview?id=<projectKey>).
sonar.organization=TU_ORGANIZATION_KEY
sonar.projectKey=TU_PROJECT_KEY

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
